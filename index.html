<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Biqsha Dig Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
/* Layout: mobile-game shell — top resource bar, screen body, bottom tab bar with a raised Play button.
   In a dig: HUD on top, the trench canvas in the middle, a tool hotbar at the bottom. Dusk-desert single look. */
:root{
  color-scheme:dark;
  --sky-0:#120f2b; --sky-1:#221a4a; --sky-2:#4a2d63; --sky-3:#a54a4a; --sky-4:#f0a04b;
  --panel:rgba(22,18,48,.78); --panel-2:rgba(40,32,80,.7); --edge:rgba(255,255,255,.10);
  --ink:#fbf3e4; --muted:#b9b0cf;
  --gold-a:#ffd66b; --gold-b:#f39a2f; --gold-sh:#a95a17;
  --blue-a:#6aa8ff; --blue-b:#3b5fd0; --blue-sh:#24398a;
  --red-a:#ff7a6b; --red-b:#d93a3a; --red-sh:#8a1f22;
  --good:#7be08a; --danger:#ff5d4d;
  --r-common:#cfc6b4; --r-rare:#5fc6ff; --r-epic:#d27cff; --r-legendary:#ffc53d;
  --g-common:linear-gradient(135deg,#7d7568,#cfc6b4);
  --g-rare:linear-gradient(135deg,#2f6fd6,#5fc6ff);
  --g-epic:linear-gradient(135deg,#6a2fd6,#e070d8);
  --g-legendary:linear-gradient(135deg,#ff8a1a,#ffd84a);
  --f-display:"Reem Kufi","Readex Pro",system-ui,sans-serif;
  --f-body:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow-x:hidden;
  background:linear-gradient(180deg,var(--sky-0) 0%,var(--sky-1) 35%,var(--sky-2) 65%,var(--sky-3) 88%,var(--sky-4) 100%) fixed var(--sky-0);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold-a);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.muted{color:var(--muted);font-size:13px}
.shell{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.page{width:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:12px 16px}

/* Game-style buttons: gradient face + hard bottom edge */
.gbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:14px;
  font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em;color:#2a1405;
  background:linear-gradient(180deg,var(--gold-a),var(--gold-b));box-shadow:0 4px 0 var(--gold-sh),0 8px 18px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-sh),0 4px 10px rgba(0,0,0,.35)}
.gbtn.blue{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);background:linear-gradient(180deg,var(--blue-a),var(--blue-b));box-shadow:0 4px 0 var(--blue-sh),0 8px 18px rgba(0,0,0,.35)}
.gbtn.red{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);background:linear-gradient(180deg,var(--red-a),var(--red-b));box-shadow:0 4px 0 var(--red-sh),0 8px 18px rgba(0,0,0,.35)}
.gbtn.big{font-size:26px;min-height:64px;padding:12px 44px;border-radius:18px}
.gbtn.sm{font-size:15px;min-height:40px;padding:8px 14px;border-radius:12px}
.gbtn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#4b3e86,#2b2358);box-shadow:0 3px 0 #1a1438,0 6px 12px rgba(0,0,0,.35);border:1px solid var(--edge)}
.round svg{width:22px;height:22px}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* Top resource bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;max-width:960px;margin:0 auto;width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky-0)}
.player{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#2a1405;background:linear-gradient(135deg,var(--gold-a),var(--gold-b));box-shadow:0 3px 0 var(--gold-sh)}
.pname{display:flex;flex-direction:column;min-width:0}
.pname b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.pname span{font-size:12px;color:var(--muted)}
.res{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:99px;background:rgba(10,8,25,.6);border:1px solid var(--edge);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.pill svg{width:22px;height:22px}
.net{font-size:11px;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net.on i{background:var(--good)} .net.off i{background:var(--danger)}
@media (max-width:560px){.pill.hide-sm,.net{display:none}}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(18,15,43,.0),rgba(18,15,43,.92) 30%)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;width:100%;max-width:560px;background:linear-gradient(180deg,#2e2660,#1b1640);border:1px solid var(--edge);border-radius:22px;padding:6px;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:11px;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--ink);background:rgba(255,255,255,.08)}
.tab.play{margin-top:-30px}
.tab.play .disc{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold-a),var(--gold-b));box-shadow:0 4px 0 var(--gold-sh),0 0 0 5px #1b1640,0 10px 24px rgba(240,160,75,.5)}
.tab.play .disc svg{width:34px;height:34px}
.tab.play span{color:var(--ink);font-weight:600}

/* Home */
.hero{position:relative;border-radius:24px;overflow:hidden;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;border:1px solid var(--edge)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero > *:not(.scene){position:relative}
.logo span{margin-left:14px}
.logo{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--ink);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 30px rgba(255,190,90,.45)}
.logo small{display:block;font-size:16px;letter-spacing:.3em;text-transform:uppercase;color:#ffe2b0;margin-top:6px;font-family:var(--f-body);font-weight:600}
.nextcard{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.nextcard h2{font-size:24px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prog{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:12px}
.prog b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-b),var(--gold-a))}

/* Map */
.mapwrap{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--edge)}
.mapwrap svg{display:block;width:100%;height:auto}
.site-node{cursor:pointer} .site-node.locked{cursor:not-allowed}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sitecard{text-align:left;border-radius:16px;padding:12px;background:var(--panel);border:2px solid var(--edge);display:flex;flex-direction:column;gap:6px}
.sitecard.sel{border-color:var(--gold-a)}
.sitecard.locked{opacity:.5}
.levels{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.lvl{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lvl .node{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:700;color:#2a1405;background:linear-gradient(180deg,var(--gold-a),var(--gold-b));box-shadow:0 4px 0 var(--gold-sh),0 8px 16px rgba(0,0,0,.35)}
.lvl .node.done{background:linear-gradient(180deg,#9ff0a8,#3fbf62);box-shadow:0 4px 0 #1f7a3a,0 8px 16px rgba(0,0,0,.35)}
.lvl .node.locked{background:linear-gradient(180deg,#5d5680,#3a3460);color:#8f88b3;box-shadow:0 4px 0 #241f45}
.lvl small{font-size:12px;color:var(--muted)}
.stars{color:var(--gold-a);letter-spacing:1px;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.stars .off{color:rgba(255,255,255,.18);text-shadow:none}

/* Museum + ranks */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{border-radius:16px;padding:3px;background:var(--g-common)}
.card.r-rare{background:var(--g-rare)} .card.r-epic{background:var(--g-epic)} .card.r-legendary{background:var(--g-legendary)}
.card .in{border-radius:13px;background:linear-gradient(180deg,#2a2350,#17132f);padding:10px;height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px}
.card svg{width:56px;height:56px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.card b{font-size:13px}
.card .rar{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.r-common .rar{color:var(--r-common)} .r-rare .rar{color:var(--r-rare)} .r-epic .rar{color:var(--r-epic)} .r-legendary .rar{color:var(--r-legendary)}
.card.unknown{background:rgba(255,255,255,.12)} .card.unknown .in{opacity:.7}
.card.flip{animation:flip .55s both}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{border-radius:16px 16px 6px 6px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.pod .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pod b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.pod.p1{background:var(--g-legendary);color:#2a1405;min-height:150px}
.pod.p2{background:linear-gradient(135deg,#9aa3b5,#e3e7ef);color:#1d2230;min-height:120px}
.pod.p3{background:linear-gradient(135deg,#a2582a,#e39a5f);color:#2a1405;min-height:100px}
.pod .medal{font-family:var(--f-display);font-size:28px;font-weight:700}
.lbrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.lbrow.me{outline:2px solid var(--gold-a)}
.lbrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=text]{background:rgba(0,0,0,.35);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;min-height:48px;width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--edge)}
.switch{width:56px;height:32px;border-radius:99px;background:#3a3460;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:linear-gradient(90deg,#3fbf62,#9ff0a8)} .switch.on::after{transform:translateX(24px)}

/* Dig screen */
.game{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 0%,#3a2a5c 0%,#1a1433 60%,#120f2b 100%)}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;max-width:1100px;width:100%;margin:0 auto}
.timer{display:flex;align-items:center;gap:10px;background:rgba(10,8,25,.65);border:1px solid var(--edge);border-radius:99px;padding:6px 14px 6px 6px;max-width:460px;width:100%;justify-self:center}
.timer .sunico{width:32px;height:32px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 40%,#fff4c2,#ffb347 55%,#e0643a);box-shadow:0 0 14px #ffb347}
.timer .track{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.timer .track i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#e0643a,#ffb347 45%,#ffe08a)}
.timer.low .track i{background:linear-gradient(90deg,#a91d2e,#ff5d4d)}
.timer.low .sunico{background:radial-gradient(circle at 40% 40%,#ffd0a0,#e0643a 55%,#7a1f3a);animation:pulse .6s infinite alternate}
@keyframes pulse{to{opacity:.6}}
.timer b{font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.hearts{display:flex;gap:4px}
.hearts svg{width:28px;height:28px}
.stage{position:relative;display:grid;place-items:center;min-height:0}
.trench{position:relative;max-width:100%;max-height:100%;aspect-ratio:8/5;width:min(100%,calc((100dvh - 210px) * 1.6));border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 3px #5a3d26,0 0 0 7px #2b1d14,0 18px 40px rgba(0,0,0,.6)}
.trench canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
.objectives{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(10,8,25,.72);border:1px solid var(--edge);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;width:max-content}
.chip.done{background:linear-gradient(90deg,#2a7a40,#3fbf62);border-color:transparent}
.chip.lost{background:linear-gradient(90deg,#7a1f22,#b03030);border-color:transparent;text-decoration:line-through}
.bag{position:absolute;bottom:10px;right:10px;display:flex;gap:6px;padding:6px;border-radius:14px;background:rgba(10,8,25,.72);border:1px solid var(--edge);min-height:52px;align-items:center}
.bag .slot{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;padding:2px;background:var(--g-common)}
.bag .slot.r-rare{background:var(--g-rare)} .bag .slot.r-epic{background:var(--g-epic)} .bag .slot.r-legendary{background:var(--g-legendary)}
.bag .slot span{width:100%;height:100%;border-radius:8px;background:#1b1640;display:grid;place-items:center}
.bag .slot svg{width:28px;height:28px}
.bag .empty{font-size:12px;color:var(--muted);padding:0 8px}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:min(92%,560px);padding:10px 16px;border-radius:14px;background:rgba(10,8,25,.85);border:1px solid var(--edge);font-size:14px;text-align:center;pointer-events:none;transition:opacity .3s}
.toast.bad{background:linear-gradient(180deg,rgba(140,30,35,.92),rgba(90,15,25,.92))}
.toast.good{background:linear-gradient(180deg,rgba(40,120,60,.92),rgba(20,80,40,.92))}
.toast.gold{background:linear-gradient(180deg,rgba(200,120,20,.95),rgba(140,70,10,.95))}
.toast.hide{opacity:0}
.findpop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.findpop .card{width:170px;animation:popin 1.6s both}
@keyframes popin{0%{transform:scale(.3) rotate(-8deg);opacity:0}15%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-40px) scale(.8)}}
.hotbar{display:flex;justify-content:center;align-items:flex-end;gap:14px;max-width:1100px;width:100%;margin:0 auto;position:relative}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.tool .face{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(180deg,#4b3e86,#2b2358);box-shadow:0 4px 0 #1a1438,0 8px 16px rgba(0,0,0,.4);border:2px solid transparent;transition:transform .1s}
.tool .face svg{width:40px;height:40px}
.tool.on{color:var(--ink)}
.tool.on .face{background:linear-gradient(180deg,var(--gold-a),var(--gold-b));box-shadow:0 4px 0 var(--gold-sh),0 0 22px rgba(255,190,90,.55);transform:translateY(-4px)}
.tool kbd{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--f-body);background:#1b1640;border:1px solid var(--edge);color:var(--muted)}
.tool .count{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:99px;padding:0 6px;display:grid;place-items:center;font-size:12px;background:linear-gradient(180deg,var(--red-a),var(--red-b));color:#fff}
.tool:disabled{opacity:.45}
.finishbtn{position:absolute;right:0;bottom:12px}
@media (max-width:640px){.finishbtn{position:static}.hotbar{flex-wrap:wrap}.tool .face{width:60px;height:60px}}
.storm{position:fixed;inset:0;pointer-events:none;z-index:25;opacity:0;transition:opacity .4s;background:linear-gradient(100deg,rgba(230,190,120,.25),rgba(200,140,70,.35))}
.storm.on{opacity:1}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(255,200,70,.6),transparent 65%);opacity:0;z-index:35}
.flash.go{animation:flash 1s}
@keyframes flash{20%{opacity:1}100%{opacity:0}}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(6,4,18,.72);display:grid;place-items:center;z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(520px,100%);max-height:90dvh;overflow:auto;border-radius:24px;padding:3px;background:linear-gradient(180deg,var(--gold-a),var(--gold-b) 40%,#7a3b16);animation:rise .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.92)}}
.modal .in{border-radius:21px;background:linear-gradient(180deg,#2e2660,#17132f);padding:18px;display:flex;flex-direction:column;gap:14px}
.ribbon{margin:-18px -18px 0;padding:16px 18px 14px;border-radius:21px 21px 0 0;text-align:center;background:linear-gradient(180deg,#4a3a8c,#2e2660)}
.ribbon h2{font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.ribbon.win{background:linear-gradient(180deg,#3fbf62,#1f7a3a)}
.ribbon.lose{background:linear-gradient(180deg,#d93a3a,#7a1f22)}
.close{position:absolute;top:12px;right:12px;z-index:2}
.bigstars{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-top:4px}
.bigstars span{display:block;width:58px;height:58px}
.bigstars span:nth-child(2){width:74px;height:74px;margin-bottom:14px}
.bigstars svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.bigstars .on{animation:starpop .5s both}
.bigstars .on:nth-child(2){animation-delay:.25s}.bigstars .on:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.25)}to{transform:none}}
.goals{display:flex;flex-direction:column;gap:8px}
.goal{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:14px}
.goal svg{width:22px;height:22px;flex:none}

function tone(freq, dur=.08, type="square", vol=.05, when=0){

}

/* ---------- Noise ---------- */
function makeNoise(seed){
  const perm = new Uint8Array(512); const p = [...Array(256).keys()];
  let s = seed; const rnd = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i=255;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [p[i],p[j]] = [p[j],p[i]]; }
  for (let i=0;i<512;i++) perm[i] = p[i&255];
  const val = (x,y) => perm[(perm[x&255] + y) & 511] / 255;
  const sm = t => t*t*(3-2*t);
  const n2 = (x,y) => { const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const a=val(xi,yi), b=val(xi+1,yi), c=val(xi,yi+1), d=val(xi+1,yi+1), u=sm(xf), v=sm(yf);
    return a+(b-a)*u + (c-a)*v + (a-b-c+d)*u*v; };
  return (x,y,oct=3) => { let sum=0, amp=1, f=1, norm=0; for (let o=0;o<oct;o++){ sum+=n2(x*f,y*f)*amp; norm+=amp; amp*=.5; f*=2; } return sum/norm; };
}

/* ---------- Level config ---------- */
function levelCfg(i){
  const s = Math.floor(i/3), l = i%3, site = SITES[s];
  return {i, s, l, site,
    time: 90 - l*8 - s*3,
    pieces: 3 + (s>=2?1:0) + (l===2?1:0),
    snakes: 1 + Math.floor((s*3+l)/4),
    scorpions: s>=1 ? Math.min(3, s + (l===2?1:0)) : 0,
    water: 1 + (s>=3?1:0),
    scans: s>=4 ? 2 : 3,
    storm: s>=3};
}
const need = cfg => cfg.pieces - 1;
function rollPiece(site, weights){
  let n = Math.random()*100, idx = 0;
  for (; idx<4; idx++){ n -= weights[idx]; if (n < 0) break; }
  const r = ["common","rare","epic","legendary"][Math.min(idx,3)];
  const pool = PIECES.filter(p=>p.site===site.id && p.r===r);
  return pool[Math.floor(Math.random()*pool.length)];
}

}

async function buildLevel(cfg){
  const noise = makeNoise(1 + Math.floor(Math.random()*1e6));
  const T = new Float32Array(GW*GH), T0 = new Float32Array(GW*GH), bed = new Float32Array(GW*GH), grain = new Float32Array(GW*GH);
  const D = cfg.site.depth;
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++){
    const i = y*GW+x, wx = x*G, wy = y*G;
    const mound = noise(wx*.0045, wy*.0045, 3), detail = noise(wx*.025+90, wy*.025+30, 2);
    T0[i] = T[i] = D*(.55 + .45*mound + .12*detail);
    bed[i] = .35*noise(wx*.006+200, wy*.006+200, 2);
    grain[i] = (Math.random()-.5)*.08 + (noise(wx*.08+400, wy*.08, 1)-.5)*.12;
  }
  // Place items with spacing
  const items = [], spots = [];
  const place = (size) => {
    for (let t=0;t<400;t++){
      const x = 70 + Math.random()*(WW-140), y = 70 + Math.random()*(WH-140);
      if (spots.every(s => Math.hypot(s.x-x, s.y-y) > (s.size+size)/2 + 26)){ spots.push({x,y,size}); return {x,y}; }
    }
    return {x:70+Math.random()*(WW-140), y:70+Math.random()*(WH-140)};
  };
  const used = new Set();
  for (let p=0;p<cfg.pieces;p++){
    let piece = rollPiece(cfg.site, cfg.site.weights);
    if (p===0 && cfg.l===2 && piece.r==="common") piece = rollPiece(cfg.site,[0,60,30,10]);
    for (let t=0; t<6 && used.has(piece.id); t++) piece = rollPiece(cfg.site, cfg.site.weights);
    used.add(piece.id);
    const size = 92 + Math.random()*22;
    items.push({t:"piece", piece, size, ...place(size), rot:(Math.random()-.5)*1.4, hp:100, cracks:[]});
  }
  for (let p=0;p<cfg.snakes;p++){ const size = 104; items.push({t:"snake", size, ...place(size), rot:Math.random()*6.28}); }
  for (let p=0;p<cfg.scorpions;p++){ const size = 76; items.push({t:"scorpion", size, ...place(size), rot:Math.random()*6.28}); }
  for (let p=0;p<cfg.water;p++){ const size = 64; items.push({t:"water", size, ...place(size), rot:(Math.random()-.5)*1.2}); }
  await Promise.all(items.map(it => ready(itemGlyph(it))));
  const lv = {T, T0, bed, grain, items, mask:new Int16Array(GW*GH), floor:makeFloor(cfg)};
  rebuildMasks(lv);
  return lv;
}
function rebuildMasks(lv){
  lv.mask.fill(0);
  const c = document.createElement("canvas"); c.width = GW; c.height = GH;
  const x = c.getContext("2d", {willReadFrequently:true});
  lv.items.forEach((it,n) => {
    it.px = [];
    if (it.gone) return;
    x.clearRect(0,0,GW,GH);
    x.save(); x.translate(it.x/G, it.y/G); x.rotate(it.rot); const s = it.size/G; x.drawImage(itemGlyph(it), -s/2, -s/2, s, s); x.restore();
    const d = x.getImageData(0,0,GW,GH).data;
    for (let i=0;i<GW*GH;i++) if (d[i*4+3] > 90 && !lv.mask[i]){ lv.mask[i] = n+1; it.px.push(i); }
  });
}
function makeFloor(cfg){
  const c = document.createElement("canvas"); c.width = WW; c.height = WH;
  const x = c.getContext("2d");
  const deep = cfg.site.soil[4];
  const g = x.createRadialGradient(WW/2, WH/2, 60, WW/2, WH/2, WW*.7);
  g.addColorStop(0, shade(deep, 1.05)); g.addColorStop(1, shade(deep, .55));
  x.fillStyle = g; x.fillRect(0,0,WW,WH);
  for (let k=0;k<900;k++){ x.fillStyle = `rgba(${Math.random()<.5?"0,0,0":"255,230,200"},${Math.random()*.12})`; const r = Math.random()*3+.5; x.beginPath(); x.arc(Math.random()*WW, Math.random()*WH, r, 0, 6.28); x.fill(); }
  return c;
}
function hex(c){ const n = parseInt(c.slice(1),16); return [n>>16, (n>>8)&255, n&255]; }
function shade(c,f){ const [r,g,b] = hex(c); return `rgb(${Math.min(255,r*f)|0},${Math.min(255,g*f)|0},${Math.min(255,b*f)|0})`; }

/* ---------- Game state ---------- */
let view = "home", selSite = 0, G_ = null, raf = 0, modal = null, popup = null;
const app = document.getElementById("app");
let cv, cx, soilC, soilX, soilImg, strata;

async function startLevel(i){
  modal = null; popup = null;
  const cfg = levelCfg(i);
  view = "dig"; renderDigShell(cfg);
  const lv = await buildLevel(cfg);
  G_ = {cfg, lv, tool:"trowel", time:cfg.time, hearts:3, scans:cfg.scans, found:[], over:false, paused:false,
        last:performance.now(), stormDone:!cfg.storm, lowWarned:false, tick:0,
        ptr:{x:-99,y:-99,down:false,in:false,lastScoop:null}, particles:[], actors:[], pulses:[], trails:[], dirty:true, msgT:0};
  strata = buildStrata(cfg.site.soil);
  paintHud(); paintTools(); paintBag();
  if (!P.tut){ G_.paused = true; modal = {type:"tutorial"}; renderModal(); }
  else toast(i===0 ? "Scan first, then dig. Brush the last layer when you see an outline." : `Find ${need(cfg)} pieces before sunset.`);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function buildStrata(cols){
  // Colour by depth dug: 5 bands with soft blends and a thin dark seam between bands
  const N = 256, out = new Uint8ClampedArray(N*3), stops = cols.map(hex);
  for (let k=0;k<N;k++){
    const d = k/N*1.6, band = Math.min(3.999, d/0.4), b = Math.floor(band), f = band-b;
    const a = stops[b], c = stops[b+1], t = f<.75 ? f*.25 : .19 + (f-.75)*3.2;
    const seam = d > .08 && (f>.93 || f<.03) ? .84 : 1;
    for (let j=0;j<3;j++) out[k*3+j] = (a[j] + (c[j]-a[j])*Math.min(1,t)) * seam;
  }
  return out;
}

/* ---------- Tools ---------- */
function toWorld(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*WW, y:(e.clientY-r.top)/r.height*WH}; }
function forDisk(x,y,r,fn){
  const gx0 = Math.max(0, Math.floor((x-r)/G)), gx1 = Math.min(GW-1, Math.ceil((x+r)/G));
  const gy0 = Math.max(0, Math.floor((y-r)/G)), gy1 = Math.min(GH-1, Math.ceil((y+r)/G));
  for (let gy=gy0; gy<=gy1; gy++) for (let gx=gx0; gx<=gx1; gx++){
    const d = Math.hypot(gx*G+G/2-x, gy*G+G/2-y); if (d > r) continue;
    fn(gy*GW+gx, 1 - (d/r)*(d/r));
  }
}
function scoop(x,y){
  const lv = G_.lv, hits = new Map();
  forDisk(x,y,TROWEL.r,(i,f) => {
    const amt = TROWEL.amt*(.35+.65*f), t = lv.T[i], m = lv.mask[i];
    if (m && t < amt && t < .5){ const it = lv.items[m-1]; if (!it.got && !it.gone) hits.set(it, (hits.get(it)||0) + 1); }
    lv.T[i] = Math.max(0, t - amt);
  });
  sfx.dig(); dust(x,y,14, G_.cfg.site.soil[1]);
  G_.dirty = true;
  for (const [it,n] of hits){
    if (n < 4) continue;
    if (it.t === "piece"){
      const dmg = Math.min(40, 10 + n*.5);
      it.hp = Math.max(15, Math.round(it.hp - dmg)); sfx.crack(); shakeStage();
      it.cracks.push({a:Math.random()*6.28, l:.3+Math.random()*.25});
      toast(`Crack! The trowel hit the ${it.piece.name.toLowerCase()} (${it.hp}% intact). Use the brush when you see an outline.`, "bad");
    } else if (it.t === "snake" || it.t === "scorpion"){
      G_.hearts--; G_.time = Math.max(0, G_.time - 5); sfx.bite(); shakeStage(); paintHud();
      toast(`${it.t==="snake"?"A snake bit you":"A scorpion stung you"}! −1 life, −5 s. Brush over red marks to stay safe.`, "bad");
      flee(it, false);
      if (G_.hearts <= 0) setTimeout(()=>endLevel("hearts"), 600);
    }
  }
  checkItems();
}
function brushAt(x,y,dt){
  const lv = G_.lv;
  forDisk(x,y,BRUSH.r,(i,f) => { lv.T[i] = Math.max(0, lv.T[i] - BRUSH.rate*dt*(.25+.75*f)); });
  if (Math.random() < .35) dust(x,y,2, G_.cfg.site.soil[0], .6);
  if (Math.random() < .2) sfx.brush();
  G_.dirty = true;
}
function scanAt(x,y){
  if (G_.scans <= 0){ toast("No scans left on this dig.", "bad"); return; }
  G_.scans--; sfx.scan(); paintTools();
  G_.pulses.push({x,y,t:0});
  let p = 0, d = 0;
  G_.lv.items.forEach(it => { if (!it.got && !it.gone && Math.hypot(it.x-x, it.y-y) < SCAN_R){ it.scanned = true; it.jx = (Math.random()-.5)*16; it.jy = (Math.random()-.5)*16; if (it.t==="piece") p++; else if (it.t!=="water") d++; } });
  toast(p||d ? `Scan: ${p} piece${p===1?"":"s"} (gold rings) and ${d} danger${d===1?"":"s"} (red rings) here.` : "Scan: nothing here. Dig fast with the trowel.", d ? "bad" : p ? "gold" : "");
  if (G_.scans === 0){ G_.tool = "trowel"; paintTools(); }
}
function uncovered(it){
  if (!it.px.length) return 0;
  let n = 0; for (const i of it.px) if (G_.lv.T[i] < CLEAR_T) n++;
  return n / it.px.length;
}
function checkItems(){
  for (const it of G_.lv.items){
    if (it.got || it.gone) continue;
    const u = uncovered(it);
    if (it.t === "piece" && u > .8) collect(it);
    else if (it.t === "water" && u > .5){ it.got = true; G_.time += 8; sfx.water(); toast("Water flask! +8 seconds of daylight.", "good"); clearUnder(it); }
    else if ((it.t === "snake" || it.t === "scorpion") && u > .3){
      sfx.hiss(); toast(it.t==="snake" ? "A snake! It slid away under the sand. Follow the tracks and keep clear." : "A scorpion! It scuttled off the site.", "bad");
      flee(it, it.t === "snake");
    }
  }
}
function clearUnder(it){ for (const i of it.px) G_.lv.T[i] = 0; G_.dirty = true; }
function collect(it){
  it.got = true; clearUnder(it);
  G_.found.push({piece:it.piece, hp:it.hp});
  sfx.find(it.piece.r);
  if (it.piece.r === "legendary" || it.piece.r === "epic") burst();
  sparkle(it.x, it.y, it.piece.r);
  showFind(it.piece, it.hp);
  const left = need(G_.cfg) - G_.found.length;
  toast(`${RAR[it.piece.r].label}: ${it.piece.name}, ${it.hp}% intact. ${left>0 ? `${left} more to go.` : "Enough for the museum! Finish now or keep digging."}`, it.hp<75 ? "bad" : it.piece.r==="legendary" ? "gold" : "good");
  paintBag(); paintHud();
  if (G_.found.length === G_.cfg.pieces) setTimeout(()=>endLevel("all"), 1400);
}
function flee(it, relocate){
  const from = {x:it.x, y:it.y};
  let to;
  if (relocate){
    const lv = G_.lv;
    for (let t=0;t<200;t++){
      const x = 70+Math.random()*(WW-140), y = 70+Math.random()*(WH-140);
      if (Math.hypot(x-from.x,y-from.y) < 160 || Math.hypot(x-from.x,y-from.y) > 380) continue;
      if (lv.items.some(o => o!==it && !o.got && !o.gone && Math.hypot(o.x-x,o.y-y) < (o.size+it.size)/2+10)) continue;
      const i = Math.floor(y/G)*GW + Math.floor(x/G); if (lv.T[i] < .35) continue;
      to = {x,y}; break;
    }
  }
  const dest = to || {x: from.x < WW/2 ? -120 : WW+120, y: from.y + (Math.random()-.5)*200};
  it.gone = true; it.scanned = false;
  G_.actors.push({it, from, to:dest, t:0, dur:1.3, relocate:!!to});
  rebuildMasks(G_.lv);
}
function dust(x,y,n,col,spd=1){
  for (let k=0;k<n;k++) G_.particles.push({x,y,vx:(Math.random()-.5)*260*spd,vy:(Math.random()-.8)*240*spd,life:.5+Math.random()*.4,t:0,col,r:2+Math.random()*3});
}
function sparkle(x,y,r){
  const col = {common:"#fff2d0",rare:"#7fd6ff",epic:"#e59bff",legendary:"#ffd84a"}[r];
  for (let k=0;k<40;k++){ const a = Math.random()*6.28, s = 80+Math.random()*220; G_.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.8+Math.random()*.6,t:0,col,r:2+Math.random()*3,glow:true}); }
}
function shakeStage(){ const t = document.querySelector(".trench"); if (!t) return; t.animate([{transform:"translate(0,0)"},{transform:"translate(-6px,3px)"},{transform:"translate(5px,-3px)"},{transform:"translate(0,0)"}],{duration:280}); }
function burst(){ const f = document.getElementById("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
function sandstorm(){
  const st = document.getElementById("storm"); st.classList.add("on");
  toast("Sandstorm! Sand is blowing back into the trench.", "bad");
  G_.storm = 1.8;
  setTimeout(() => {
    st.classList.remove("on");
    if (!G_ || G_.over) return;
    const lv = G_.lv, n = makeNoise(Math.floor(Math.random()*1e5));
    for (let i=0;i<GW*GH;i++){ const x = (i%GW)*G, y = Math.floor(i/GW)*G; lv.T[i] = Math.min(lv.T0[i], lv.T[i] + .22*n(x*.01,y*.01,2)); }
    lv.items.forEach(it => { if (it.got) for (const i of it.px) lv.T[i] = 0; });
    G_.dirty = true;
  }, 1800);
}

/* ---------- Frame loop & drawing ---------- */
function loop(now){
  if (!G_ || view !== "dig") return;
  const dt = Math.min(.05, (now - G_.last)/1000); G_.last = now;
  const live = !G_.paused && !G_.over && !modal;
  if (live){
    G_.time -= dt;
    if (G_.time <= 15 && Math.floor(G_.time) !== G_.tick){ G_.tick = Math.floor(G_.time); if (G_.time > 0) sfx.tick(); }
    if (G_.time <= 15 && !G_.lowWarned){ G_.lowWarned = true; toast("The sun is setting. 15 seconds left!", "bad"); }
    if (!G_.stormDone && G_.time <= G_.cfg.time/2){ G_.stormDone = true; sandstorm(); }
    if (G_.ptr.down && G_.tool === "brush" && G_.ptr.in){ brushAt(G_.ptr.x, G_.ptr.y, dt); G_.brushCheck = (G_.brushCheck||0) + dt; if (G_.brushCheck > .12){ G_.brushCheck = 0; checkItems(); } }
    if (G_.time <= 0){ G_.time = 0; endLevel("sunset"); }
    paintTimer();
  }
  if (G_.msgT > 0){ G_.msgT -= dt; if (G_.msgT <= 0) document.getElementById("toast")?.classList.add("hide"); }
  draw(dt, now/1000);
  raf = requestAnimationFrame(loop);
}
function paintSoil(){
  const lv = G_.lv, d = soilImg.data, T = lv.T, T0 = lv.T0, bed = lv.bed, M = lv.mask;
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++){
    const i = y*GW+x, o = i*4, t = T[i];
    if (t < .004){ d[o+3] = 0; continue; }
    const dug = Math.max(0, Math.max(0, T0[i] - t) + lv.grain[i]*.1);
    const k = Math.min(255, Math.max(0, (dug/1.6*256)|0))*3;
    // Hillshade from the surface height (bed + soil): light from the top-left
    const xa = x>0?i-1:i, xb = x<GW-1?i+1:i, ya = y>0?i-GW:i, yb = y<GH-1?i+GW:i;
    const sx = (bed[xb]+T[xb]) - (bed[xa]+T[xa]), sy = (bed[yb]+T[yb]) - (bed[ya]+T[ya]);
    let sh = 1 - (sx + sy)*4.5 + lv.grain[i]*.35;
    const m = M[i];
    if (m && t < HINT_T){ const it = lv.items[m-1]; if (!it.got && !it.gone) sh *= 1 - (1 - t/HINT_T)*.42; }
    sh = Math.max(.45, Math.min(1.45, sh));
    d[o] = strata[k]*sh; d[o+1] = strata[k+1]*sh; d[o+2] = strata[k+2]*sh;
    d[o+3] = Math.min(255, t/.09*255);
  }
  soilX.putImageData(soilImg, 0, 0);
}
function draw(dt, now){
  const lv = G_.lv;
  if (G_.dirty){ paintSoil(); G_.dirty = false; }
  cx.drawImage(lv.floor, 0, 0);
  // Buried items (and imprints of collected ones)
  for (const it of lv.items){
    if (it.gone) continue;
    cx.save(); cx.translate(it.x, it.y); cx.rotate(it.rot);
    if (it.got){ cx.globalAlpha = .22; cx.filter = "brightness(0)"; }
    else { cx.shadowColor = "rgba(0,0,0,.55)"; cx.shadowBlur = 8; cx.shadowOffsetY = 3; }
    const s = it.size; cx.drawImage(itemGlyph(it), -s/2, -s/2, s, s);
    cx.filter = "none"; cx.shadowColor = "transparent";
    if (!it.got && it.cracks?.length){
      cx.strokeStyle = "rgba(25,12,5,.9)"; cx.lineWidth = 2.2;
      it.cracks.forEach(c => { cx.beginPath(); let px = 0, py = 0; cx.moveTo(px,py); for (let k=0;k<4;k++){ px += Math.cos(c.a + (k%2?.5:-.4))*s*c.l/4; py += Math.sin(c.a + (k%2?.5:-.4))*s*c.l/4; cx.lineTo(px,py); } cx.stroke(); });
    }
    cx.restore();
  }
  // Soil over everything, smoothly upscaled (no visible cells)
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = "high";
  cx.filter = "blur(1.6px)"; cx.drawImage(soilC, 0, 0, WW, WH); cx.filter = "none";
  // Snake tracks
  for (const tr of G_.trails){
    cx.save(); cx.strokeStyle = "rgba(60,30,15,.45)"; cx.lineWidth = 7; cx.lineCap = "round"; cx.setLineDash([2,10]);
    cx.beginPath(); for (let k=0;k<=24;k++){ const f = k/24, x = tr.a.x + (tr.b.x-tr.a.x)*f, y = tr.a.y + (tr.b.y-tr.a.y)*f, n = Math.sin(f*18)*10; const ang = Math.atan2(tr.b.y-tr.a.y, tr.b.x-tr.a.x)+Math.PI/2; k ? cx.lineTo(x+Math.cos(ang)*n, y+Math.sin(ang)*n) : cx.moveTo(x,y); } cx.stroke(); cx.restore();
  }
  // Scan rings
  for (const it of lv.items){
    if (!it.scanned || it.got || it.gone) continue;
    const col = it.t==="piece" ? "255,214,107" : it.t==="water" ? "110,210,230" : "255,93,77";
    const r = it.size*.55 + Math.sin(now*4)*3;
    cx.save(); cx.strokeStyle = `rgba(${col},.85)`; cx.lineWidth = 3; cx.setLineDash([8,7]); cx.lineDashOffset = -now*20;
    cx.beginPath(); cx.arc(it.x+it.jx, it.y+it.jy, r, 0, 6.28); cx.stroke();
    cx.fillStyle = `rgba(${col},.12)`; cx.fill();
    cx.setLineDash([]); cx.fillStyle = `rgb(${col})`; cx.font = "700 20px Readex Pro, sans-serif"; cx.textAlign = "center";
    cx.fillText(it.t==="piece" ? "✦" : it.t==="water" ? "+8s" : "!", it.x+it.jx, it.y+it.jy+7);
    cx.restore();
  }
  // Scan pulses
  G_.pulses = G_.pulses.filter(p => (p.t += dt) < .9);
  for (const p of G_.pulses){ cx.save(); cx.strokeStyle = `rgba(140,220,255,${1-p.t/.9})`; cx.lineWidth = 4; cx.beginPath(); cx.arc(p.x,p.y, SCAN_R*(p.t/.9), 0, 6.28); cx.stroke(); cx.restore(); }
  // Fleeing creatures
  G_.actors = G_.actors.filter(a => {
    a.t += dt; const f = Math.min(1, a.t/a.dur), e = f<.5 ? 2*f*f : 1-Math.pow(-2*f+2,2)/2;
    const x = a.from.x + (a.to.x-a.from.x)*e, y = a.from.y + (a.to.y-a.from.y)*e;
    const ang = Math.atan2(a.to.y-a.from.y, a.to.x-a.from.x);
    cx.save(); cx.translate(x + Math.sin(a.t*30)*3, y); cx.rotate(ang + Math.PI/2); const s = a.it.size*(a.relocate ? 1-.5*f : 1);
    cx.drawImage(a.it.t==="snake" ? glyphImg("viper","#8a6a3a") : glyphImg("scorpion","#3d2a1a"), -s/2, -s/2, s, s); cx.restore();
    if (f >= 1){
      if (a.relocate){ a.it.x = a.to.x; a.it.y = a.to.y; a.it.gone = false; a.it.rot = Math.random()*6.28; G_.trails.push({a:a.from, b:a.to}); rebuildMasks(G_.lv); }
      return false;
    }
    return true;
  });
  // Particles
  G_.particles = G_.particles.filter(p => (p.t += dt) < p.life);
  for (const p of G_.particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 520*dt*(p.glow?0.3:1); p.vx *= .97;
    cx.globalAlpha = 1 - p.t/p.life; cx.fillStyle = p.col;
    if (p.glow){ cx.shadowColor = p.col; cx.shadowBlur = 10; }
    cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.28); cx.fill(); cx.shadowBlur = 0;
  }
  cx.globalAlpha = 1;
  // Trench vignette
  const v = cx.createRadialGradient(WW/2, WH/2, WH*.35, WW/2, WH/2, WW*.62);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(20,8,0,.55)");
  cx.fillStyle = v; cx.fillRect(0,0,WW,WH);
  // Sand haze during storm
  if (G_.storm > 0){ G_.storm -= dt; cx.fillStyle = "rgba(220,180,120,.35)"; for (let k=0;k<60;k++){ const y = Math.random()*WH, x = Math.random()*WW; cx.fillRect(x, y, 40+Math.random()*80, 2); } }
  // Tool cursor
  const pt = G_.ptr;
  if (pt.in && !G_.over){
    const r = G_.tool==="trowel" ? TROWEL.r : G_.tool==="brush" ? BRUSH.r : 26;
    cx.save(); cx.strokeStyle = G_.tool==="scan" ? "rgba(140,220,255,.9)" : "rgba(255,255,255,.75)"; cx.lineWidth = 2; cx.setLineDash(G_.tool==="brush"?[4,4]:[]);
    cx.beginPath(); cx.arc(pt.x, pt.y, r, 0, 6.28); cx.stroke(); cx.setLineDash([]);
    const ti = glyphImg(G_.tool, G_.tool==="trowel" ? "#c9ccd4" : G_.tool==="brush" ? "#e8c27a" : "#8cdcff");
    cx.translate(pt.x + 16, pt.y - 44); cx.rotate(pt.down ? -.5 : -.2); cx.drawImage(ti, -22, -22, 50, 50);
    cx.restore();
  }
}

/* ---------- Input ---------- */
function bindCanvas(){
  const pt = () => G_?.ptr;
  cv.addEventListener("pointerdown", e => {
    if (!G_ || G_.over || G_.paused || modal) return;
    cv.setPointerCapture(e.pointerId);
    const p = toWorld(e); Object.assign(pt(), p, {down:true, in:true});
    if (G_.tool === "trowel"){ scoop(p.x,p.y); pt().lastScoop = p; }
    else if (G_.tool === "scan") scanAt(p.x,p.y);
  });
  cv.addEventListener("pointermove", e => {
    if (!G_) return;
    const p = toWorld(e); Object.assign(pt(), p, {in:true});
    if (pt().down && G_.tool === "trowel" && !G_.over && !G_.paused && !modal){
      const l = pt().lastScoop; if (l && Math.hypot(p.x-l.x, p.y-l.y) > 34){ scoop(p.x,p.y); pt().lastScoop = p; }
    }
  });
  const up = () => { if (G_){ pt().down = false; pt().lastScoop = null; if (G_.tool==="brush") checkItems(); } };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("pointerleave", () => { if (G_){ pt().in = false; up(); } });
}

/* ---------- End of dig ---------- */
function starsFor(g, won){ return [won, won && g.found.every(f=>f.hp>=75), won && g.found.length===g.cfg.pieces]; }
function endLevel(reason){
  if (!G_ || G_.over) return;
  G_.over = true;
  const won = G_.found.length >= need(G_.cfg) && G_.hearts > 0;
  const st = starsFor(G_, won), stars = st.filter(Boolean).length;
  const pieceScore = G_.found.reduce((a,f)=>a + Math.round(RAR[f.piece.r].value * f.hp/100), 0);
  const timeBonus = won ? Math.round(G_.time*4) : 0, lifeBonus = won ? G_.hearts*50 : 0;
  const score = won ? pieceScore + timeBonus + lifeBonus : 0;
  const key = lvKey(G_.cfg.i), prev = P.done[key], newPieces = [];
  G_.found.forEach(f => { if (!P.museum[f.piece.id]) newPieces.push(f.piece.id); P.museum[f.piece.id] = (P.museum[f.piece.id]||0)+1; });
  const firstClear = won && !prev;
  if (won && (!prev || score > prev.score || stars > prev.stars)) P.done[key] = {score:Math.max(score, prev?.score||0), stars:Math.max(stars, prev?.stars||0)};
  P.runs.unshift({at:Date.now(), lvl:G_.cfg.i, score}); P.runs = P.runs.slice(0,30);
  save(); pushScore();
  won ? sfx.win() : sfx.lose();
  modal = {type:"result", won, reason, stars, pieceScore, timeBonus, lifeBonus, score, best:P.done[key]?.score||0, newPieces,
    unlockSite: firstClear && G_.cfg.l===2 && G_.cfg.s<4 ? SITES[G_.cfg.s+1] : null};
  setTimeout(renderModal, 500);
}

  const m = modal;
  if (m.type === "level"){
    const c = levelCfg(m.i), d = P.done[lvKey(m.i)];
    o.innerHTML = `<div class="modal" role="dialog" aria-label="Dig ${m.i+1}"><div class="in">
      <button class="round close" id="m-close" aria-label="Close">${glyph("x","#fff")}</button>
      <div class="ribbon"><div class="eyebrow" style="color:#d8d0f5">${c.site.name} · ${c.site.area}</div><h2>Dig ${m.i+1} · ${DIG_NAMES[c.l]}</h2>${bigStars(d?.stars||0)}</div>
      <div class="goals">
        <div class="goal">${glyph("star","#ffd66b")}Find ${need(c)} of the ${c.pieces} buried pieces</div>
        <div class="goal">${glyph("star","#ffd66b")}Keep every piece 75% intact or better</div>
        <div class="goal">${glyph("star","#ffd66b")}Find all ${c.pieces} pieces</div>
      </div>
      <div class="infochips">
        <span class="chip">${glyph("clock","#ffd66b").replace("<svg","<svg width='14' height='14'")} ${c.time}s daylight</span>
        <span class="chip">${c.scans} scans</span>
        <span class="chip" style="color:#ff9a8d">${c.snakes} snake${c.snakes>1?"s":""}</span>
        ${c.scorpions?`<span class="chip" style="color:#ff9a8d">${c.scorpions} scorpion${c.scorpions>1?"s":""}</span>`:""}
        ${c.storm?`<span class="chip" style="color:#ffd08a">Sandstorm</span>`:""}
      </div>
      ${d ? `<p class="muted" style="text-align:center;margin:0">Best score: ${d.score.toLocaleString()}</p>` : ""}
      <div class="btnrow"><button class="gbtn big" id="m-play">${glyph("play","#2a1405").replace("<svg","<svg width='26' height='26'")}Play</button></div>
    </div></div>`;
  } else if (m.type === "pause"){
    o.innerHTML = `<div class="modal" role="dialog" aria-label="Paused"><div class="in">
      <div class="ribbon"><h2>Paused</h2><p class="muted" style="margin:4px 0 0">The sun stops while you are paused.</p></div>
      <div style="display:flex;flex-direction:column;gap:12px;align-items:stretch">
        <button class="gbtn big" id="m-resume">${glyph("play","#2a1405").replace("<svg","<svg width='24' height='24'")}Resume</button>
        <button class="gbtn blue" id="m-restart">Restart dig</button>
        <button class="gbtn blue" id="m-sound">${P.muted?"Sound: off":"Sound: on"}</button>
        <button class="gbtn red" id="m-quit">Quit to map</button>
      </div></div></div>`;
  } else if (m.type === "tutorial"){
    o.innerHTML = `<div class="modal" role="dialog" aria-label="How to dig"><div class="in">
      <div class="ribbon"><h2>How to dig</h2><p class="muted" style="margin:4px 0 0">Find pieces before the sun sets.</p></div>
      <div class="tutcards">
        <div>${glyph("scan","#8cdcff")}<b>1 · Scan</b>Shows gold rings over pieces and red rings over snakes.</div>
        <div>${glyph("trowel","#d6d9e0")}<b>2 · Trowel</b>Fast. Click or drag to scoop soil. It cracks pieces it hits.</div>
        <div>${glyph("brush","#f0c77a")}<b>3 · Brush</b>Slow but safe. Hold and sweep when an outline shows through.</div>
      </div>
      <p class="muted" style="text-align:center;margin:0">Dark outlines in the soil mean something is close. Switch to the brush.</p>
      <div class="btnrow"><button class="gbtn big" id="m-tut">Let's dig</button></div>
    </div></div>`;
  } else if (m.type === "settings"){
    o.innerHTML = `<div class="modal" role="dialog" aria-label="Settings"><div class="in">
      <button class="round close" id="m-close" aria-label="Close">${glyph("x","#fff")}</button>
      <div class="ribbon"><h2>Settings</h2></div>
      <label for="nick" class="eyebrow">Player name</label>
      <div style="display:flex;gap:8px"><input type="text" id="nick" maxlength="20"><button class="gbtn sm" id="m-savenick">Save</button></div>
      <div class="setrow"><span>Sound</span><button class="switch ${P.muted?"":"on"}" id="m-mute" aria-pressed="${!P.muted}" aria-label="Sound"></button></div>
      <div class="setrow"><span>How to dig</span><button class="gbtn sm blue" id="m-howto">Show</button></div>
      <div class="setrow" style="border:0"><span>Reset all progress</span><button class="gbtn sm red" id="m-reset">${m.confirmReset?"Tap again to confirm":"Reset"}</button></div>
    </div></div>`;
  } else if (m.type === "result"){
    const c = G_.cfg, why = {sunset:"The sun set before you found enough pieces.", hearts:"You ran out of lives. Brush over red rings next time.", all:"You found every piece in this trench!", finish:"Dig closed and logged."}[m.reason];
    o.innerHTML = `<div class="modal" role="dialog" aria-label="Dig result"><div class="in">
      <div class="ribbon ${m.won?"win":"lose"}"><div class="eyebrow" style="color:#fff">${c.site.name} · ${DIG_NAMES[c.l]}</div><h2>${m.won?"Find logged!":"Dig failed"}</h2>${bigStars(m.stars)}<p style="margin:6px 0 0;font-size:13px">${why}</p></div>
      ${G_.found.length ? `<div class="cards">${G_.found.map((f,i)=>`<div class="card flip r-${f.piece.r}" style="animation-delay:${.3+i*.15}s"><div class="in">${glyph(f.piece.g, pieceColor(f.piece))}<span class="rar">${RAR[f.piece.r].label}${m.newPieces.includes(f.piece.id) && G_.found.findIndex(x=>x.piece.id===f.piece.id)===i?" · New":""}</span><b>${f.piece.name}</b><span class="muted">${f.hp}% intact</span></div></div>`).join("")}</div>` : ""}
      ${m.won ? `<div><div class="score"><span>Pieces (value × intact)</span><span>${m.pieceScore}</span></div><div class="score"><span>Daylight left</span><span>${m.timeBonus}</span></div><div class="score"><span>Lives left</span><span>${m.lifeBonus}</span></div><div class="score total"><span>Score</span><span>${m.score.toLocaleString()}</span></div></div>` : `<p class="muted" style="text-align:center;margin:0">Pieces you found still go to your museum.</p>`}
      ${m.unlockSite ? `<div class="chip done" style="justify-self:center;margin:0 auto">New site unlocked: ${m.unlockSite.name}</div>` : ""}
      <div class="btnrow">
        <button class="gbtn blue" id="m-retry">Retry</button>
        <button class="gbtn blue" id="m-map">Map</button>
        ${m.won && c.i < 14 ? `<button class="gbtn" id="m-next">Next ${glyph("play","#2a1405").replace("<svg","<svg width='18' height='18'")}</button>` : ""}
      </div></div></div>`;
  }
  document.body.appendChild(o);
  const q = id => o.querySelector("#"+id), on = (id,fn) => { const b = q(id); if (b) b.onclick = () => { sfx.tap(); fn(); }; };
  on("m-close", () => { modal = null; renderModal(); });
  on("m-play", () => startLevel(m.i));
  on("m-resume", () => { modal = null; G_.paused = false; G_.last = performance.now(); renderModal(); });
  on("m-restart", () => startLevel(G_.cfg.i));
  on("m-retry", () => startLevel(G_.cfg.i));
  on("m-next", () => startLevel(G_.cfg.i + 1));
  on("m-quit", () => leaveDig(G_.cfg.s));
  on("m-map", () => leaveDig(m.unlockSite ? G_.cfg.s+1 : G_.cfg.s));
  on("m-sound", () => { P.muted = !P.muted; save(); renderModal(); });
  on("m-tut", () => { P.tut = true; save(); modal = null; renderModal(); if (G_){ G_.paused = false; G_.last = performance.now(); toast("Scan first, then dig. Brush the last layer when you see an outline."); } });
  on("m-mute", () => { P.muted = !P.muted; save(); renderModal(); });
  on("m-howto", () => { modal = {type:"tutorial"}; renderModal(); });
  on("m-reset", () => { if (!m.confirmReset){ m.confirmReset = true; renderModal(); return; } const nick = P.nick; P = blank(); P.nick = nick; save(); modal = null; render(); });
  if (q("nick")){ q("nick").value = P.nick; on("m-savenick", () => { const v = q("nick").value.trim().slice(0,20); if (v){ P.nick = v; save(); lastPushed = -1; pushScore(); modal = null; render(); } }); }
  o.addEventListener("click", e => { if (e.target === o && (m.type==="level"||m.type==="settings")){ modal = null; renderModal(); } });
  (q("m-play")||q("m-resume")||q("m-next")||q("m-tut")||o.querySelector(".gbtn"))?.focus();
}
function leaveDig(site){ cancelAnimationFrame(raf); selSite = site; G_ = null; modal = null; view = "map"; render(); }

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape" && modal && (modal.type==="level"||modal.type==="settings")){ modal = null; renderModal(); return; }
  if (view !== "dig" || !G_ || G_.over) return;
  if (e.key === "Escape"){ if (modal?.type === "pause"){ modal = null; G_.paused = false; G_.last = performance.now(); } else if (!modal){ G_.paused = true; modal = {type:"pause"}; } renderModal(); return; }
  if (modal) return;
  const k = {"1":"scan","2":"trowel","3":"brush"}[e.key];
  if (k && !(k==="scan" && G_.scans<=0)){ G_.tool = k; paintTools(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden && G_ && !G_.over && !modal){ G_.paused = true; modal = {type:"pause"}; renderModal(); } });

function start(){ selSite = Math.min(4, Math.floor(unlockedUpTo()/3)); render(); connect(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
})();
</script>

</body></html>
